[package]
name         = "terraform-versions-tracker"
authors      = ["John H"]
repository   = "https://github.com/John361/terraform-versions-tracker"
readme       = "README.md"
license-file = "LICENSE"
version      = "0.1.0"
edition      = "2024"
categories   = ["command-line-utilities"]

[[bin]]
name = "terraform-versions-tracker"
path = "src/bin/main.rs"

[lib]
name = "lib_tvt"
path = "src/lib/lib.rs"

[dependencies]
anyhow             = "1.0.104"
clap               = { version = "4.6.6", features = ["derive", "env"] }
hcl-rs             = "0.19.8"
serde              = { version = "1.0.229", features = ["std", "derive"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir            = "2.5.0"
